name = "subpool-worker"
main = "src/index.js"
compatibility_date = "2025-11-02"

workers_dev = true
# 关闭遥测
send_metrics = false

[assets]
directory = "./public"
binding = "ASSETS"
# 需要让 Worker 先执行，以便统一鉴权和安全响应头
run_worker_first = true

# KV 命名空间
[[kv_namespaces]]
binding = "KV"  # 不要修改此项
id = "df4351aa871b4138b93bb5afdfe0a531"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DEBUG_SECRET = "12345678"
INIT_SECRET = "987654321"
LOG_LEVEL = "info"
