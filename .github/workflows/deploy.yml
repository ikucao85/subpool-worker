name: Deploy SubPool Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 部署到 Cloudflare Workers
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 代码检查与测试
        run: npm run check

      - name: 部署到 Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          api-token: ${{ secrets.CF_API_TOKEN }}
          account-id: ${{ secrets.CF_ACCOUNT_ID }}
          wrangler-version: "v4"
          command: deploy
